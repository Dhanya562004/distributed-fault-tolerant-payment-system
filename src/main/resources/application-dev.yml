spring:
  datasource:
    url: jdbc:h2:mem:payments_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://localhost:27017/payment_audit_db?connectTimeoutMS=500&serverSelectionTimeoutMS=500

logging:
  level:
    root: INFO
    com.paymentsystem: DEBUG
    org.springframework.orm.jpa: INFO
