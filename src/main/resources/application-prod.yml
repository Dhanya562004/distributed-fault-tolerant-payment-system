spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/payment_audit_db}

logging:
  level:
    root: INFO
    com.paymentsystem: INFO

app:
  webhook:
    allow-private-destinations: false
  pagination:
    signing-secret: ${PAGINATION_SIGNING_SECRET:}
    security:
      enabled: ${PAGINATION_SECURITY_ENABLED:true}
      api-key: ${PAGINATION_API_KEY:}
