# ---------------------------------------------------------
# Distributed Fault-Tolerant Payment System Properties
# ---------------------------------------------------------

spring.application.name=distributed-fault-tolerant-payment-system
spring.profiles.active=dev

# Server Port & Context Path
server.port=8080
server.servlet.context-path=/

# Disable MongoDB Auto-Configuration & Health Checks
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
management.health.mongo.enabled=false

# Actuator Endpoints & Health Check
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:payments_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=INFO
logging.level.com.paymentsystem=INFO
